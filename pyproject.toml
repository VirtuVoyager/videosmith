[project]
name = "storysmith-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/storysmith-core",
    "packages/storysmith-adapters",
    "apps/worker",
    "apps/api",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21",
    "debugpy>=1.8",
    "deepeval",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "wp1: WP1 contracts/state/orchestrator skeleton",
    "wp2: WP2 creative director + director + char refs",
    "wp3: WP3 videographer + replicate video adapter",
    "wp4: WP4 music director",
    "wp5: WP5 editor",
    "wp6: WP6 critic/QA",
    "wp7: WP7 review gate, publisher, API, UI",
    "wp8: WP8 observability + cost ledger + ops",
    "amendment01: HANDOFF_SPEC_AMENDMENT_01 start-frame conditioned scene generation",
    "amendment02: Amendment 02 user-authored character library + multi-character dialogue",
    "slow: slow-running tests excluded from default CI run",
]
addopts = "--ignore=tests/llm -p no:deepeval"
# -p no:deepeval: deepeval registers a pytest11 plugin, so plain top-level
# `pytest`/`uv run pytest` auto-imports deepeval/__init__.py regardless of
# --ignore=tests/llm -- and that import unconditionally calls
# autoload_dotenv(), dumping the *entire* .env file (not just SS_-prefixed
# keys, and not scoped by any settings_test(_env_file=None) override) into
# os.environ for the whole pytest session. tests/llm's own real deepeval
# runs go through `uv run deepeval test run tests/llm` (a separate CLI),
# not pytest, so disabling the plugin here doesn't affect it.

[tool.coverage.run]
source = ["packages/storysmith-core/src/storysmith"]
