[project]
name = "storysmith-core"
version = "0.1.0"
requires-python = ">=3.12"
description = "Pydantic contracts, ports, LangGraph orchestration for StorySmith. No cloud SDK imports, no os.environ reads."
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres",
    "structlog>=24.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storysmith"]
