name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-packages --dev
      - run: uv run ruff check packages apps tests
      - run: uv run ruff format --check packages apps tests
      - run: uv run mypy packages/storysmith-core
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # SPEC-GAP: readme_check.py + prompt-eval-guard steps from §13.1 land
      # once WP2 populates prompts/ and a real README Quickstart exists to check.
      - run: uv run pytest tests/unit -m "not slow" --cov --cov-fail-under=80
