[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.12"
description = "Nightly batch pipeline CLI entrypoint (typer): storysmith run ..."
dependencies = [
    "storysmith-core",
    "storysmith-adapters",
    "typer>=0.13",
    "debugpy>=1.8",
]

[tool.uv.sources]
storysmith-core = { workspace = true }
storysmith-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[project.scripts]
storysmith = "worker.main:app"
